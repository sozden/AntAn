[workspace]
resolver = "2"
members = ["crates/antan-core", "crates/antan-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Çözücü hata ayıklama derlemesinde de hızlı çalışsın.
[profile.dev.package.antan-core]
opt-level = 3
